# Candidate #6 -- parallelogram palletizer. DECISIONS.md D1.
#
# Values tagged `!placeholder` are invented. Untagged values are datasheet
# facts, task facts, or SETTLED decisions recorded in DECISIONS.md.
#
# GEOMETRY IS SWEPT, NOT CHOSEN (D9). The values under `geometry:` are a valid
# assembly seed -- NOT a design. The sweep is the deliverable.

name: palletizer
candidate_id: 6
closed_loop: true
description: >
  Parallelogram palletizer. 3 DOF: base yaw plus two grounded planar drives on
  the rotating base. Tool held level by geometry through two chained levelling
  parallelograms. No elbow motor.

# REAL -- Longs 34HS1456 vendor datasheets, confirmed by Evan 2026-07-27.
# 2700 g.cm2 = 2.7e-4 kg.m2. Phase resistance 0.55 ohm supersedes an earlier
# 0.46 ohm figure; 0.55 is the self-consistent one, since standstill
# dissipation 2 * 5.6^2 * 0.55 = 34.50 W matches the stated 34.5 W while
# 0.46 ohm would give 28.85 W. See DECISIONS.md F6.
motor:
  part: "Longs 34HS1456 NEMA 34"
  holding_torque_nm: 8.4
  current_a_per_phase: 5.6
  full_step_deg: 1.8
  mass_kg: 3.8
  shaft_diameter_m: 0.014
  rear_shaft: false
  rotor_inertia_kgm2: 2.7e-4
  phase_resistance_ohm: 0.55

# REAL -- target task, CLAUDE.md.
task:
  board_square_m: 0.057
  board_span_m: 0.457
  reach_requirement_m: 0.600
  accuracy_target_m: 0.005

# HARD GATES. The sweep REJECTS any geometry violating these -- it does not
# rank them. DECISIONS.md D11.
#
#   residual_*                OPEN-A. 1% / 0.1% of the 5 mm accuracy budget.
#   joint_torque_cap_nm       D10. Driver-current cap, sized to demand+margin,
#                             NOT to motor capability. See F7 -- the belt spec
#                             below cannot actually carry this. OPEN-B.
#   tool_m_per_full_step_max  D5. 1.0 mm = 20% of the 5 mm budget, scored on
#                             the worst square over the whole board.
validity:
  residual_invalid_m: 50.0e-6
  residual_target_m: 5.0e-6
  joint_torque_cap_nm: 48.0
  tool_m_per_full_step_max: 0.0010

# SETTLED D4 (1:25, two-stage belt, even 1:5 x 1:5 split).
# rating_n_per_inch: manufacturer allowable working tension per 25.4 mm of
# belt width. Source: SDP/SI Handbook of Timing Belts and Pulleys, Technical
# Section, Table 3 "Allowable Working Tension of Different Belt Constructions"
# (neoprene / fibreglass cord). Already includes the 1/15-of-ultimate design
# factor stated in that document's Section 9. DECISIONS.md F7.
drive_train:
  stages:
    - name: stage1
      pitch_mm: 5.0
      driver_teeth: 20
      driven_teeth: 100
      width_mm: 15.0
      profile: HTD-5M
      centre_distance_mm: 130.0
    - name: stage2
      pitch_mm: 5.0
      driver_teeth: 20
      driven_teeth: 100
      width_mm: 25.0
      profile: HTD-5M
      centre_distance_mm: 130.0
  rating_n_per_inch:
    HTD-5M: 454.0
    HTD-8M: 792.0
    GT3-5M: 712.0
    GT3-8M: 1690.0

# PLACEHOLDER -- assembly seed only, swept per D9.
geometry:
  shoulder_height_m: !placeholder 0.45
  upper_arm_m: !placeholder 0.40
  forearm_m: !placeholder 0.35
  drive_lever_m: !placeholder 0.12
  level_offset_m: !placeholder 0.10
  tool_drop_m: !placeholder 0.10
  motor_mount_offset_m: !placeholder 0.12

# D3-REQ clearance check. Piece diameter is Evan's (~30-35 mm); jaw figures are
# PLACEHOLDER until a gripper exists.
gripper:
  piece_diameter_m: 0.032
  jaw_span_open_m: !placeholder 0.044
  jaw_thickness_m: !placeholder 0.006
  body_width_m: !placeholder 0.050
  # Height above the board surface at which the piece is gripped. Board surface
  # and arm base mounting face are both taken as z = 0 (same table).
  grip_height_m: !placeholder 0.020

# Coarse. D9: the deliverable is the SHAPE of the surface and the trade curve.
# No refinement until the trade curve has been reviewed.
sweep:
  upper_arm_m:      {min: 0.30, max: 0.55, steps: 4}
  forearm_m:        {min: 0.25, max: 0.50, steps: 4}
  board_radius_m:   {min: 0.30, max: 0.70, steps: 5}
  board_yaw_rad:    {min: 0.0,  max: 0.785398, steps: 3}

joints:
  - name: q0_yaw
    min_rad: !placeholder -3.1416
    max_rad: !placeholder 3.1416
    max_vel_rad_s: !placeholder 1.5
    max_accel_rad_s2: !placeholder 4.0
    drive: &belt_2stage
      kind: belt_2stage
      reduction: 25.0
      microsteps: !placeholder 16
      efficiency: !placeholder 0.90
  - name: q1_upper_arm
    min_rad: !placeholder -0.5236
    max_rad: !placeholder 1.5708
    max_vel_rad_s: !placeholder 1.5
    max_accel_rad_s2: !placeholder 4.0
    drive: *belt_2stage
  - name: q2_forearm
    min_rad: !placeholder -2.0944
    max_rad: !placeholder 0.5236
    max_vel_rad_s: !placeholder 1.5
    max_accel_rad_s2: !placeholder 4.0
    drive: *belt_2stage
